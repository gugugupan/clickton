<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#F6F1E9" />
    <title>Clickton</title>
    <meta name="description" content="An endless, cozy brick town: click tiles together, finish railways and roads, and watch trains, people and animals come alive." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Clickton · 咔哒镇 · カチッとタウン" />
    <meta property="og:description" content="An endless, cozy brick town. Click tiles together and watch it come alive." />
    <meta property="og:image" content="https://gugugupan.github.io/clickton/og-image.jpg" />
    <meta property="og:url" content="https://gugugupan.github.io/clickton/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
    <script>
      if (location.hostname === "gugugupan.github.io") {
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () { dataLayer.push(arguments); };
        gtag("js", new Date());
        gtag("config", "G-8J5VSLTX1B");
        var ga = document.createElement("script");
        ga.async = true;
        ga.src = "https://www.googletagmanager.com/gtag/js?id=G-8J5VSLTX1B";
        document.head.appendChild(ga);
      }
    </script>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="loading">
      <img class="loader" src="/loader.svg" width="180" height="120" alt="" />
      <div class="logo">Click<span class="stud"></span>ton</div>
      <div class="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-text"></div>
    </div>
    <div id="hud">
      <header id="brand" class="card brand">
        <div class="logo">Click<span class="stud"></span>ton</div>
        <span id="score-pop" class="score-pop"></span>
        <div class="local-name" data-i18n="gameName"></div>
        <div id="theme" class="theme-line"></div>
        <div class="stats">
          <div><span class="label" data-i18n="score"></span><span id="score" class="value">0</span></div>
          <div><span class="label" data-i18n="tiles"></span><span id="tiles" class="value small">0</span></div>
        </div>
      </header>
      <section id="quests" class="card quests">
        <button id="quests-head" class="quests-head"><span data-i18n="quests"></span><span id="quests-count" class="quests-count"></span></button>
        <ol id="quest-list" class="quest-list"></ol>
      </section>
      <button id="music" class="card menu-toggle music-toggle">♪</button>
      <button id="menu-toggle" class="card menu-toggle" data-i18n-label="menu">☰</button>
      <nav id="menu" class="card menu">
        <div class="langs" id="langs"></div>
        <button id="share" class="menu-item" data-i18n="share"></button>
        <button id="photo" class="menu-item" data-i18n="photoMode"></button>
        <button id="time" class="menu-item keep-open"></button>
        <button id="help-btn" class="menu-item" data-i18n="helpBtn"></button>
        <button id="feedback-btn" class="menu-item" data-i18n="feedback"></button>
        <button id="new-game" class="menu-item" data-i18n="newGame"></button>
        <button id="back-town" class="menu-item" data-i18n="backToTown"></button>
        <button id="build-own" class="menu-item" data-i18n="buildOwn"></button>
      </nav>
      <section id="tray" class="card tray">
        <div class="tray-row">
          <div id="shelf" class="shelf" data-i18n-label="landmarkHint"></div>
          <div id="tray-tile" class="current">
            <canvas id="preview"></canvas>
            <div>
              <div class="label" data-i18n="nextTile"></div>
              <div id="tile-name" class="tile-name"></div>
              <div id="tile-hint" class="tile-hint"></div>
            </div>
          </div>
          <div class="side-stack">
            <div class="next-box">
              <canvas id="next-preview"></canvas>
              <span class="label" data-i18n="next"></span>
            </div>
            <button id="discard" class="mini" data-i18n-label="discardHint">🗑 <span data-i18n="discard"></span></button>
            <span id="discard-progress" class="mini-progress"></span>
          </div>
        </div>
        <div class="tray-row actions">
          <button id="cancel" class="pill cancel">✕ <span data-i18n="cancel"></span></button>
          <button id="confirm" class="pill confirm">✓ <span data-i18n="place"></span></button>
        </div>
      </section>
      <section id="viewer-bar" class="card viewer-bar">
        <span id="viewer-label" data-i18n="viewing"></span>
        <span id="replay-progress" class="progress"></span>
        <button id="replay" class="pill confirm">▶ <span data-i18n="replay"></span></button>
        <button id="skip" class="pill cancel" data-i18n="skip"></button>
        <button id="try-daily" class="pill confirm" data-i18n="tryDaily"></button>
      </section>
      <section id="result" class="result-backdrop">
        <div class="card result-card">
          <h2 data-i18n="dailyDone"></h2>
          <div id="result-date" class="label"></div>
          <div id="result-score" class="result-score"></div>
          <div id="result-stats" class="label"></div>
          <div id="result-best" class="label"></div>
          <div class="result-actions">
            <button id="result-share" class="pill confirm" data-i18n="shareResult"></button>
            <button id="result-again" class="pill cancel" data-i18n="playAgain"></button>
            <button id="result-close" class="pill cancel" data-i18n="backToTown"></button>
          </div>
        </div>
      </section>
      <section id="feedback" class="result-backdrop">
        <div class="card result-card fb-card">
          <h2 data-i18n="feedback"></h2>
          <p class="label" data-i18n="feedbackIntro"></p>
          <textarea id="fb-message" class="fb-input" rows="5" maxlength="3000" data-i18n-placeholder="feedbackPlaceholder"></textarea>
          <input id="fb-email" class="fb-input" type="email" autocomplete="email" data-i18n-placeholder="feedbackEmail" />
          <label class="fb-bot" aria-hidden="true"><input id="fb-bot" type="checkbox" tabindex="-1" /></label>
          <div id="fb-status" class="fb-status"></div>
          <a id="fb-mail" class="fb-mail" data-i18n="feedbackByMail"></a>
          <div class="result-actions">
            <button id="fb-cancel" class="pill cancel" data-i18n="cancel"></button>
            <button id="fb-send" class="pill confirm" data-i18n="feedbackSend"></button>
          </div>
        </div>
      </section>
      <section id="newgame" class="result-backdrop">
        <div class="card result-card">
          <h2 data-i18n="newGame"></h2>
          <button id="ng-town" class="choice">
            <strong data-i18n="townOption"></strong>
            <span class="label" data-i18n="townOptionHint"></span>
          </button>
          <div id="ng-themes" class="theme-picker"></div>
          <button id="ng-daily" class="choice">
            <strong data-i18n="dailyOption"></strong>
            <span class="label" data-i18n="dailyOptionHint"></span>
          </button>
          <div class="result-actions">
            <button id="ng-cancel" class="pill cancel" data-i18n="cancel"></button>
          </div>
        </div>
      </section>
      <section id="daily-again" class="result-backdrop">
        <div class="card result-card">
          <h2 data-i18n="dailyAgainTitle"></h2>
          <div id="da-body" class="label"></div>
          <div class="result-actions">
            <button id="da-replay" class="pill confirm" data-i18n="playAgain"></button>
            <button id="da-town" class="pill cancel" data-i18n="dailyAgainNewTown"></button>
            <button id="da-cancel" class="pill cancel" data-i18n="cancel"></button>
          </div>
        </div>
      </section>
      <section id="tutorial" class="tutorial">
        <div class="card tut-card">
          <div class="langs tut-langs" id="tut-langs"></div>
          <p id="tut-text"></p>
          <div class="tut-actions">
            <span id="tut-step" class="label"></span>
            <button id="tut-skip" class="pill cancel"></button>
            <button id="tut-next" class="pill confirm"></button>
          </div>
        </div>
      </section>
      <section id="photo-bar" class="card photo-bar">
        <button id="photo-save" class="pill confirm">💾 <span data-i18n="savePhoto"></span></button>
        <button id="photo-exit" class="pill cancel">✕ <span data-i18n="exitPhoto"></span></button>
      </section>
      <div id="toast" class="toast" role="status"></div>
      <div id="bubble" class="bubble"></div>
      <div id="rot-badge" class="rot-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3" />
          <path d="M19.8 3.8v4.6h-4.6" />
        </svg>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
