<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#F6F1E9" />
    <title>Clickton</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700&family=M+PLUS+Rounded+1c:wght@500;700&family=Noto+Sans+SC:wght@500;700&family=ZCOOL+KuaiLe&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div id="loading">
      <div class="logo">Click<span class="stud"></span>ton</div>
      <div class="loading-track"><div id="loading-bar"></div></div>
      <div id="loading-text"></div>
    </div>
    <div id="hud">
      <header class="card brand">
        <div class="logo">Click<span class="stud"></span>ton</div>
        <div class="local-name" data-i18n="gameName"></div>
        <div id="theme" class="theme-line"></div>
        <div class="stats">
          <div><span class="label" data-i18n="score"></span><span id="score" class="value">0</span></div>
          <div><span class="label" data-i18n="tiles"></span><span id="tiles" class="value small">0</span></div>
          <div><span class="label" data-i18n="holes"></span><span id="holes" class="value small">0</span></div>
        </div>
      </header>
      <nav class="card menu">
        <div class="langs" id="langs"></div>
        <button id="share" class="soft share" data-i18n="share"></button>
        <button id="new-town" class="soft ghost" data-i18n="newTown"></button>
        <button id="build-own" class="soft" data-i18n="buildOwn"></button>
      </nav>
      <section id="tray" class="card tray">
        <div class="tray-row">
          <button id="rot-left" class="round" data-i18n-label="rotateLeft">↺</button>
          <div id="tray-tile" class="current">
            <canvas id="preview"></canvas>
            <div>
              <div class="label" data-i18n="nextTile"></div>
              <div id="tile-name" class="tile-name"></div>
            </div>
          </div>
          <button id="rot-right" class="round" data-i18n-label="rotateRight">↻</button>
        </div>
        <div class="tray-row actions">
          <button id="cancel" class="pill cancel">✕ <span data-i18n="cancel"></span></button>
          <button id="confirm" class="pill confirm">✓ <span data-i18n="place"></span></button>
        </div>
      </section>
      <section id="viewer-bar" class="card viewer-bar">
        <span data-i18n="viewing"></span>
        <span id="replay-progress" class="progress"></span>
        <button id="replay" class="pill confirm">▶ <span data-i18n="replay"></span></button>
        <button id="skip" class="pill cancel" data-i18n="skip"></button>
      </section>
      <p id="help" class="help"></p>
      <div id="toast" class="toast" role="status"></div>
      <div id="bubble" class="bubble"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
