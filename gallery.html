<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clickton game assets</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Noto+Sans+SC:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <header class="bar">
      <div>
        <h1>Clickton 游戏素材一览</h1>
        <p id="status">加载中…</p>
      </div>
      <div class="controls">
        <a class="link" href="./kit.html">原创模型对比 →</a>
        <input id="filter" type="search" placeholder="搜索，如 城市 / road / tree" />
      </div>
    </header>
    <aside id="viewer" class="viewer">
      <div class="viewer-head">
        <strong id="viewer-name"></strong>
        <button id="viewer-close" aria-label="关闭">✕</button>
      </div>
      <div id="viewer-stage"></div>
      <select id="clip"></select>
    </aside>
    <main id="packs"></main>
    <script type="module" src="/src/gallery/main.ts"></script>
  </body>
</html>
